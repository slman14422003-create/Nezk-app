<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>غير متصل - نيزك إنستا</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #111b21;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .offline-container {
            max-width: 400px;
            padding: 40px 30px;
            background: #1f2c33;
            border-radius: 20px;
            border: 1px solid #2a3942;
        }
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #405DE6, #5851DB, #833AB4, #C13584, #E1306C, #FD1D1D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p {
            color: #8e8e8e;
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        .btn {
            display: inline-block;
            padding: 14px 40px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #405DE6, #5851DB, #833AB4, #C13584, #E1306C, #FD1D1D);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            transform: scale(1.02);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .status {
            color: #25D366;
            font-size: 0.8rem;
            margin-top: 15px;
        }
        .retry-text {
            color: #8e8e8e;
            font-size: 0.7rem;
            margin-top: 10px;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #25D366;
            margin-right: 5px;
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>نيزك إنستا</h1>
        <p>
            ❌ أنت غير متصل بالإنترنت<br />
            الرجاء التحقق من اتصالك بالشبكة
        </p>
        <button class="btn" onclick="location.reload()">🔄 إعادة المحاولة</button>
        <div class="status">
            <span class="dot"></span>
            في انتظار الاتصال...
        </div>
        <div class="retry-text">
            سيتم إعادة المحاولة تلقائياً عند توفر الإنترنت
        </div>
    </div>

    <script>
        // محاولة إعادة الاتصال تلقائياً
        let retryCount = 0;
        const maxRetries = 5;

        function checkConnection() {
            if (navigator.onLine) {
                location.reload();
            } else if (retryCount < maxRetries) {
                retryCount++;
                setTimeout(checkConnection, 3000);
            }
        }

        // الاستماع لعودة الاتصال
        window.addEventListener('online', () => {
            location.reload();
        });

        // بدء محاولة إعادة الاتصال
        setTimeout(checkConnection, 2000);
    </script>
</body>
</html>
