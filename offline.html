<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>غير متصل - نيزك إنستا</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    
    body {
      background: #111b21;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .offline-container {
      text-align: center;
      max-width: 400px;
    }
    
    .offline-icon {
      font-size: 5rem;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .offline-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #405DE6, #5851DB, #833AB4, #C13584, #E1306C, #FD1D1D);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .offline-subtitle {
      color: #8e8e8e;
      font-size: 1rem;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    .offline-features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 30px;
    }
    
    .offline-feature {
      background: rgba(255,255,255,0.05);
      padding: 16px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    
    .offline-feature .icon {
      font-size: 2rem;
      display: block;
      margin-bottom: 4px;
    }
    
    .offline-feature .label {
      font-size: 0.7rem;
      color: #8e8e8e;
    }
    
    .offline-btn {
      display: inline-block;
      padding: 12px 32px;
      border: none;
      border-radius: 25px;
      background: linear-gradient(135deg, #405DE6, #5851DB);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      text-decoration: none;
    }
    
    .offline-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 30px rgba(64, 93, 230, 0.3);
    }
    
    .offline-btn:active {
      transform: scale(0.96);
    }
    
    .offline-status {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #6a6a6a;
    }
    
    .offline-status .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #E1306C;
      margin-left: 6px;
      animation: blink 1.5s infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    @media (max-width: 480px) {
      .offline-features {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      
      .offline-feature {
        padding: 12px 8px;
      }
      
      .offline-feature .icon {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">🌐</div>
    <h1 class="offline-title">نيزك إنستا</h1>
    <p class="offline-subtitle">
      عذراً، أنت غير متصل بالإنترنت<br />
      بعض الميزات قد لا تعمل بشكل كامل
    </p>
    
    <div class="offline-features">
      <div class="offline-feature">
        <span class="icon">📝</span>
        <span class="label">الرسائل المحفوظة</span>
      </div>
      <div class="offline-feature">
        <span class="icon">👥</span>
        <span class="label">جهات الاتصال</span>
      </div>
      <div class="offline-feature">
        <span class="icon">🎨</span>
        <span class="label">الستيكرات</span>
      </div>
      <div class="offline-feature">
        <span class="icon">⚙️</span>
        <span class="label">الإعدادات</span>
      </div>
    </div>
    
    <button class="offline-btn" onclick="location.reload()">
      🔄 إعادة المحاولة
    </button>
    
    <div class="offline-status">
      <span class="dot"></span>
      غير متصل بالإنترنت
    </div>
  </div>
  
  <script>
    // مراقبة الاتصال
    window.addEventListener('online', () => {
      location.reload();
    });
    
    // محاولة إعادة الاتصال تلقائياً
    let retryCount = 0;
    const maxRetries = 5;
    
    const retryInterval = setInterval(() => {
      if (navigator.onLine) {
        clearInterval(retryInterval);
        location.reload();
      }
      retryCount++;
      if (retryCount >= maxRetries) {
        clearInterval(retryInterval);
      }
    }, 5000);
  </script>
</body>
</html>
